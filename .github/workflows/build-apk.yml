name: Build Android APK

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK & CMake
        run: |
          ANDROID_SDK=$ANDROID_HOME
          if [ -z "$ANDROID_HOME" ]; then
            ANDROID_SDK=$HOME/Android/Sdk
          fi
          echo "Using SDK: $ANDROID_SDK"
          ls $ANDROID_SDK/cmdline-tools/*/bin/sdkmanager 2>/dev/null || {
            echo "Installing cmdline-tools"
            mkdir -p $ANDROID_SDK/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d $ANDROID_SDK/cmdline-tools
            mv $ANDROID_SDK/cmdline-tools/cmdline-tools $ANDROID_SDK/cmdline-tools/latest
          }
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todA-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
